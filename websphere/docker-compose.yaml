services:

  websphere:
    build:
      context: .
      dockerfile: Dockerfile

    image: websphere-otel:9.0.5.24

    container_name: websphere
    hostname: websphere
    restart: unless-stopped

    ports:
      - "9043:9043"
      - "9060:9060"
      - "9080:9080"
      - "9443:9443"

    environment:
      OTEL_SERVICE_NAME: "j2ee-fin-app"
      OTEL_SERVICE_VERSION: "1.0.0"

      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "none"

      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=docker,service.namespace=j2ee"

    volumes:
      - "./jdbc/db2:/jdbc/db2:ro"

    depends_on:
      - db2
      - otel-collector

    networks:
      - app-network


  db2:
    image: ibmcom/db2

    container_name: db2
    hostname: db2
    restart: unless-stopped
    privileged: true

    environment:
      LICENSE: "accept"
      DB2INSTANCE: "db2inst1"
      DB2INST1_PASSWORD: "maximus"
      DBNAME: "testdb"

    ports:
      - "50000:50000"

    volumes:
      - "./DB2:/database"

    networks:
      - app-network




  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    hostname: otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol-contrib/otel-collector-config.yaml"

    volumes:
      - "./Observability/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro"


    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

    networks:
      - app-network


networks:
  app-network:
    driver: bridge
